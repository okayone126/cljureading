<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클쥬리딩 인증</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f6f2;color:#1a1a18;min-height:100vh;}
.wrap{max-width:480px;margin:0 auto;padding:1.5rem 1rem;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
h1{font-size:18px;font-weight:700;color:#1a1a18;}
.date-tag{font-size:12px;color:#888;background:#eee;padding:3px 8px;border-radius:20px;}

/* 탭 */
.tabs{display:flex;border-bottom:1px solid #e0dfd8;margin-bottom:1.5rem;}
.tab-btn{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 0;cursor:pointer;font-size:14px;color:#888;margin-bottom:-1px;}
.tab-btn.active{color:#1a7a5e;border-bottom-color:#1a7a5e;font-weight:600;}

/* 섹션 */
.section{display:none;}
.section.active{display:block;}

/* 이름 선택 */
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem;}
.name-btn{padding:10px;border:1.5px solid #e0dfd8;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;color:#333;text-align:center;transition:all 0.15s;}
.name-btn.selected{border-color:#1a7a5e;background:#e8f5f0;color:#1a7a5e;font-weight:600;}

/* 인증 버튼 */
.cert-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#1a7a5e;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:8px;}
.cert-btn:disabled{background:#ccc;cursor:not-allowed;}
.status-msg{font-size:13px;color:#888;text-align:center;min-height:20px;}
.status-msg.ok{color:#1a7a5e;}
.status-msg.err{color:#e05;}

/* 오늘 현황 */
.today-summary{background:#fff;border-radius:12px;padding:1rem;margin-bottom:1.5rem;border:1px solid #eee;}
.today-summary h3{font-size:13px;color:#888;margin-bottom:10px;}
.cert-list{display:flex;flex-wrap:wrap;gap:6px;}
.cert-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:#e8f5f0;color:#1a7a5e;}
.not-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:#f5f5f5;color:#aaa;}
.count-badge{font-size:24px;font-weight:700;color:#1a7a5e;text-align:center;padding:8px 0;}
.count-sub{font-size:12px;color:#aaa;text-align:center;margin-top:-4px;margin-bottom:12px;}

/* 주간 현황 (관리자) */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.nav-btn{width:32px;height:32px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;}
.week-label{flex:1;text-align:center;font-size:14px;font-weight:500;}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:12px;overflow:hidden;}
th{padding:8px 4px;background:#f7f6f2;color:#888;font-weight:500;text-align:center;}
td{padding:7px 4px;border-top:1px solid #f0f0ee;text-align:center;}
.name-td{text-align:left;padding-left:10px;font-size:13px;}
.check-ok{color:#1a7a5e;font-size:15px;}
.check-no{color:#ddd;}
.cnt-good{color:#1a7a5e;font-weight:600;}
.cnt-mid{color:#e0a020;font-weight:600;}
.cnt-low{color:#ccc;}
.admin-toggle{font-size:12px;color:#aaa;text-align:right;margin-bottom:8px;cursor:pointer;text-decoration:underline;}
.loading{text-align:center;color:#aaa;font-size:13px;padding:2rem;}
.week-export-btn{width:100%;margin-top:10px;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;color:#333;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 클쥬리딩</h1>
    <span class="date-tag" id="today-tag"></span>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('check',this)">인증하기</button>
    <button class="tab-btn" onclick="switchTab('today',this)">오늘현황</button>
    <button class="tab-btn" onclick="switchTab('week',this)">주간현황</button>
  </div>

  <!-- 인증하기 -->
  <div id="sec-check" class="section active">
    <p style="font-size:13px;color:#888;margin-bottom:12px;">이름을 선택하고 인증 버튼을 눌러주세요</p>
    <div class="name-grid" id="name-grid"></div>
    <button class="cert-btn" id="cert-btn" onclick="certify()" disabled>인증하기</button>
    <p class="status-msg" id="status-msg"></p>
  </div>

  <!-- 오늘현황 -->
  <div id="sec-today" class="section">
    <div class="today-summary">
      <div class="count-badge" id="today-count">-</div>
      <div class="count-sub">오늘 인증 완료</div>
      <h3>인증 완료</h3>
      <div class="cert-list" id="cert-done"></div>
    </div>
    <div class="today-summary">
      <h3>미인증</h3>
      <div class="cert-list" id="cert-not"></div>
    </div>
  </div>

  <!-- 주간현황 -->
  <div id="sec-week" class="section">
    <div class="week-nav">
      <button class="nav-btn" onclick="prevWeek()">‹</button>
      <span class="week-label" id="week-label"></span>
      <button class="nav-btn" onclick="nextWeek()">›</button>
    </div>
    <div id="week-table"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1CU9o4WJwrxQ1ogdr4FGblQLQHLArrb4",
  authDomain: "cljureading.firebaseapp.com",
  projectId: "cljureading",
  storageBucket: "cljureading.firebasestorage.app",
  messagingSenderId: "311673460953",
  appId: "1:311673460953:web:a25ee095eea287155a06c8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const MEMBERS = ['낭빠','통통','하준맘세정','하이쭌','도브로맘','방울킴','말리꽃','임보영','코코박','다다다맘','핑크돼지','ezy'];
const DAYS = ['일','월','화','수','목','금','토'];
const DAYS_MON = ['월','화','수','목','금','토','일'];

let selectedName = null;
let weekStart = getMonday(new Date());

// 날짜 유틸
function localDS(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getMonday(d) {
  d = new Date(d);
  const day = d.getDay();
  d.setDate(d.getDate() - (day===0?6:day-1));
  d.setHours(0,0,0,0);
  return d;
}
function fmt(d) { return (d.getMonth()+1)+'/'+d.getDate(); }

// 오늘 날짜 표시
const today = new Date();
document.getElementById('today-tag').textContent = localDS(today);

// 이름 버튼 생성
const grid = document.getElementById('name-grid');
MEMBERS.forEach(name => {
  const btn = document.createElement('button');
  btn.className = 'name-btn';
  btn.textContent = name;
  btn.onclick = () => selectName(name, btn);
  grid.appendChild(btn);
});

function selectName(name, btn) {
  selectedName = name;
  document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('cert-btn').disabled = false;
  document.getElementById('status-msg').textContent = '';
}

// 인증하기
window.certify = async function() {
  if (!selectedName) return;
  const btn = document.getElementById('cert-btn');
  const msg = document.getElementById('status-msg');
  btn.disabled = true;
  msg.textContent = '저장 중...';
  msg.className = 'status-msg';

  try {
    const dateStr = localDS(today);
    const docRef = doc(db, 'attendance', dateStr);
    const snap = await getDoc(docRef);
    const data = snap.exists() ? snap.data() : {};
    data[selectedName] = true;
    await setDoc(docRef, data);
    msg.textContent = `${selectedName} 인증 완료! 📚`;
    msg.className = 'status-msg ok';
    document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));
    selectedName = null;
  } catch(e) {
    msg.textContent = '오류가 발생했어요. 다시 시도해주세요.';
    msg.className = 'status-msg err';
    btn.disabled = false;
  }
};

// 탭 전환
window.switchTab = function(name, btnEl) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  btnEl.classList.add('active');
  if (name==='today') loadToday();
  if (name==='week') renderWeek();
};

// 오늘현황 로드
async function loadToday() {
  const dateStr = localDS(today);
  const snap = await getDoc(doc(db, 'attendance', dateStr));
  const data = snap.exists() ? snap.data() : {};
  const done = MEMBERS.filter(m => data[m]);
  const not = MEMBERS.filter(m => !data[m]);

  document.getElementById('today-count').textContent = `${done.length} / ${MEMBERS.length}명`;
  document.getElementById('cert-done').innerHTML = done.map(m => `<span class="cert-chip">${m}</span>`).join('') || '<span style="color:#ccc;font-size:12px;">아직 없어요</span>';
  document.getElementById('cert-not').innerHTML = not.map(m => `<span class="not-chip">${m}</span>`).join('');
}

// 주간현황
window.prevWeek = function() { weekStart.setDate(weekStart.getDate()-7); renderWeek(); };
window.nextWeek = function() { weekStart.setDate(weekStart.getDate()+7); renderWeek(); };

async function renderWeek() {
  const dates = [];
  for (let i=0;i<7;i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    dates.push(d);
  }
  document.getElementById('week-label').textContent = `${fmt(dates[0])}(월) ~ ${fmt(dates[6])}(일)`;
  document.getElementById('week-table').innerHTML = '<div class="loading">불러오는 중...</div>';

  const att = {};
  for (const d of dates) {
    const snap = await getDoc(doc(db, 'attendance', localDS(d)));
    att[localDS(d)] = snap.exists() ? snap.data() : {};
  }

  const todayStr = localDS(today);
  let html = '<table><tr><th style="text-align:left;padding-left:10px;">멤버</th>';
  dates.forEach((d,i) => {
    const isToday = localDS(d)===todayStr;
    html += `<th style="${isToday?'color:#1a7a5e;':i>=5?'color:#bbb;':''}">${DAYS_MON[i]}<br><span style="font-weight:400;font-size:10px;">${fmt(d)}</span></th>`;
  });
  html += '<th>계</th></tr>';

  MEMBERS.forEach(m => {
    let cnt = 0;
    html += `<tr><td class="name-td">${m}</td>`;
    dates.forEach(d => {
      const ok = att[localDS(d)]?.[m];
      if(ok) cnt++;
      html += `<td>${ok?'<span class="check-ok">✓</span>':'<span class="check-no">·</span>'}</td>`;
    });
    const cls = cnt>=5?'cnt-good':cnt>=3?'cnt-mid':'cnt-low';
    html += `<td class="${cls}">${cnt}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('week-table').innerHTML = html;
}
</script>
</body>
</html>
